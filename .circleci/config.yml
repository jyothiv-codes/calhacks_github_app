version: 2.1

jobs:
  build:
    docker:
      - image: circleci/python:3.9  # Use a Python Docker image
    steps:
      - checkout
      - run:
          name: Install System Dependencies
          command: |
            sudo apt-get update
            sudo apt-get install -y \
              libasound2-dev \
              portaudio19-dev \
              libportaudiocpp0 \
              ffmpeg \
              alsa-utils
      - run:
          name: Install Python Dependencies
          command: |
            python -m pip install --upgrade pip
            pip install -r requirements.txt
      - run:
          name: Skip Tests (No tests defined yet)
          command: echo "Skipping tests because none are defined."
      - run:
          name: Run Linting
          command: flake8 app.py

workflows:
  version: 2
  build-and-test:
    jobs:
      - build:
          filters:
            branches:
              only:
                - << pipeline.git.branch >>
