version: 2.1

# Define jobs
jobs:
  build:
    docker:
      - image: circleci/node:14  # Use a Node.js Docker image
    steps:
      - checkout  # Check out the code from your repository
      - run:
          name: Install Dependencies
          command: npm install  # Install Node.js dependencies
      - run:
          name: Skip Tests (No tests defined yet)
          command: echo "Skipping tests because none are defined."

# Define workflows
workflows:
  version: 2
  build-and-test:
    jobs:
      - build:
          filters:
            branches:
              only:
                - << pipeline.git.branch >>