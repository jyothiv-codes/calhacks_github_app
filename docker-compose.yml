version: "3.8"

services:
  streamlit-app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8501:8501"
    environment:
      - HUME_API_KEY=
      - HUME_SECRET_KEY=
      - TWILIO_ACCOUNT_SID=
      - TWILIO_AUTH_TOKEN=
      - TWILIO_RECIPIENT=
      - GOOGLE_API_KEY=
      - CHROMA_HOST=chromadb
    volumes:
      - .:/app

  chromadb:
    image: chromadb/chroma:latest
    ports:
      - "8000:8000"
    volumes:
      - chromadb_data:/data 

volumes:
  chromadb_data:
    driver: local